name: Release

# Builds the desktop and phone apps. Run it by hand from the Actions tab, or push a tag like v2.0.0
# to also attach the builds to a draft GitHub release. The desktop apps update once the draft is published.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          # The .yml and .blockmap files are the update feed the installed apps read.
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/latest-linux.yml

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run mobile:sync
      - run: ./gradlew assembleDebug
        working-directory: apps/mobile/android
      - run: mv apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk Uniplan-android-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: Uniplan-android-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The installed apps compare this version with their own, so the tag has to match it.
      - name: Check the tag matches the app version
        run: |
          version="v$(jq -r .version apps/desktop/package.json)"
          [ "$version" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME doesn't match apps/desktop/package.json ($version)"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          path: builds
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" builds/* --draft --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
